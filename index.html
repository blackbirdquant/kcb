<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Colorado Platform — LIVE · KCOB · DQ 26-099 RM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0e3a2b; --green:#1f6e47; --green2:#2f9c6a; --sky:#2b7fb8;
    --sand:#f3efe4; --amber:#df8b2a; --red:#c0492c; --violet:#6e00ff;
    --ink:#13201a; --muted:#5e6c64; --line:#e4e9e3; --bg:#f5f8f4; --card:#ffffff;
    --st-spon:#1f6e47; --st-avail:#c7cec5; --st-pend:#df8b2a; --st-vol:#2b7fb8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:14px}
  .disp{font-family:"Bricolage Grotesque",sans-serif}
  .mono{font-family:"JetBrains Mono",monospace}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}

  /* topbar */
  .topbar{height:60px;background:var(--forest);color:#fff;display:flex;align-items:center;
    gap:18px;padding:0 20px;position:sticky;top:0;z-index:50}
  .logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;
    font-size:18px;letter-spacing:-.01em}
  .logo .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--green2),var(--sky));
    display:grid;place-items:center;font-size:16px}
  .demo-badge{font-family:"JetBrains Mono";font-size:10.5px;letter-spacing:.12em;background:var(--amber);
    color:#3a2406;padding:4px 9px;border-radius:4px;font-weight:700;text-transform:uppercase}
  .topbar .spacer{flex:1}
  .rolewrap{display:flex;align-items:center;gap:8px;font-size:12px;color:#bcd6c8}
  .rolewrap select{background:#0a2c20;color:#fff;border:1px solid #2a5a45;border-radius:7px;
    padding:7px 10px;font-family:"Hanken Grotesk";font-size:13px;font-weight:600}
  .who{display:flex;align-items:center;gap:9px;font-size:13px}
  .who .av{width:30px;height:30px;border-radius:50%;background:var(--green2);display:grid;place-items:center;
    font-weight:700;font-size:13px}

  /* layout */
  .shell{display:flex;min-height:calc(100vh - 60px)}
  nav.side{width:226px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;
    flex-shrink:0}
  .navsec{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:16px 10px 7px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--ink);
    font-weight:600;font-size:13.5px;border:none;background:none;width:100%;text-align:left;margin-bottom:2px}
  .navitem .ic{width:18px;text-align:center;opacity:.8}
  .navitem:hover{background:var(--bg)}
  .navitem.active{background:var(--forest);color:#fff}
  .navitem .badge{margin-left:auto;background:var(--amber);color:#3a2406;font-family:"JetBrains Mono";
    font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
  .navitem.active .badge{background:var(--green2);color:#06281b}

  main{flex:1;padding:26px 30px 60px;max-width:1280px}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:6px;flex-wrap:wrap}
  h1.title{font-family:"Bricolage Grotesque";font-weight:800;font-size:27px;letter-spacing:-.02em}
  .subtitle{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  .view{display:none;animation:fade .35s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* cards / kpis */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;letter-spacing:-.02em;margin-top:7px;line-height:1}
  .kpi .d{font-size:11.5px;margin-top:7px;font-weight:600}
  .up{color:var(--green)} .warn{color:var(--amber)} .dn{color:var(--red)}
  .kpi .bar{height:6px;background:var(--bg);border-radius:6px;margin-top:11px;overflow:hidden}
  .kpi .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green2),var(--green))}

  .row{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:980px){.row{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h3{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;margin-bottom:3px}
  .panel .ps{font-size:12px;color:var(--muted);margin-bottom:14px}

  /* revenue bars */
  .rev .line{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:10px;padding:7px 0}
  .rev .nm{font-size:13px;font-weight:600}
  .rev .nm small{display:block;color:var(--muted);font-weight:500;font-family:"JetBrains Mono";font-size:10px}
  .track{height:20px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
  .track i{position:absolute;left:0;top:0;height:100%;border-radius:6px;opacity:.92}
  .track i.cur{background:var(--green)}
  .track .pot{position:absolute;top:0;height:100%;border-right:2px dashed var(--muted);opacity:.5}
  .rev .amt{font-family:"JetBrains Mono";font-size:12px;text-align:right;font-weight:500}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* donut */
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut{flex-shrink:0}
  .dlist{font-size:12.5px;width:100%}
  .dlist .dl{display:flex;align-items:center;gap:8px;padding:5px 0;justify-content:space-between}
  .dlist .dl .l{display:flex;align-items:center;gap:8px}
  .dlist .dl b{font-family:"JetBrains Mono";font-weight:700}

  /* map */
  .maptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;
    font-weight:600;color:var(--muted)}
  .chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
  .maprow{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}
  @media(max-width:980px){.maprow{grid-template-columns:1fr}}
  .zone{cursor:pointer}
  .zone polygon{stroke:#fff;stroke-width:2.5;transition:filter .2s,stroke .2s}
  .zone:hover polygon,.zone.sel polygon{stroke:var(--ink);stroke-width:4;filter:brightness(1.05)}
  .zlab{font-family:"Bricolage Grotesque";font-weight:800;fill:#fff;pointer-events:none}
  .zsub{font-family:"JetBrains Mono";fill:#fff;opacity:.92;pointer-events:none}
  .segdetail{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:15px;font-size:13px}
  .segdetail .rid{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .kv span:first-child{color:var(--muted)}
  .kv b{font-family:"JetBrains Mono";font-weight:500}
  .statuspill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;display:inline-block}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line)}
  tr:hover td{background:var(--bg)}
  .tier{font-family:"JetBrains Mono";font-size:11px;font-weight:600}
  .stag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .s-active{background:#e3f2ea;color:var(--green)}
  .s-pending{background:#fcf0dd;color:#9a5e12}
  .s-overdue{background:#f8e3dd;color:var(--red)}

  /* field mobile mock */
  .phonewrap{display:flex;gap:26px;flex-wrap:wrap}
  .phone{width:300px;background:#0e3a2b;border-radius:34px;padding:11px;flex-shrink:0;
    box-shadow:0 18px 50px -16px rgba(14,58,43,.5)}
  .phone .screen{background:var(--bg);border-radius:25px;overflow:hidden;height:600px;display:flex;flex-direction:column}
  .phone .pbar{background:var(--forest);color:#fff;padding:13px 15px;font-weight:700;font-size:14px;
    display:flex;justify-content:space-between;align-items:center}
  .phone .offline{font-family:"JetBrains Mono";font-size:9px;background:var(--amber);color:#3a2406;
    padding:2px 6px;border-radius:4px;font-weight:700}
  .pbody{padding:14px;overflow:auto;flex:1}
  .fld{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px}
  .fld .fl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fld .fv{font-size:15px;font-weight:700;margin-top:3px}
  .fld.tap{border-style:dashed;color:var(--muted);text-align:center;font-weight:600}
  .flagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .flag{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#fff}
  .flag.haz{border-color:var(--red);color:var(--red)}
  .pbtn{background:var(--green);color:#fff;border:none;border-radius:11px;padding:13px;width:100%;
    font-weight:700;font-size:14px;margin-top:4px}

  /* reports */
  .rpt{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .rpt .ri{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex-shrink:0;
    font-size:17px}
  .rpt .rt{flex:1}
  .rpt .rt b{font-size:13.5px}
  .rpt .rt small{display:block;color:var(--muted);font-size:11.5px}
  .rpt .sec{font-family:"JetBrains Mono";font-size:10px;color:var(--muted)}
  .genbtn{border:1px solid var(--green);color:var(--green);background:#fff;border-radius:8px;padding:7px 12px;
    font-weight:700;font-size:12px}
  .genbtn.pdf{background:var(--green);color:#fff;border-color:var(--green)}

  .gauge{text-align:center}
  .gauge .gv{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px}
  .gauge small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}

  .footnote{margin-top:26px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;
    font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .footnote b{color:var(--ink)}
  .credit{display:flex;align-items:center;gap:8px}
  .credit .vd{width:8px;height:8px;border-radius:2px;background:var(--violet)}

  .banner{background:linear-gradient(100deg,var(--forest),#13503a);color:#fff;border-radius:14px;
    padding:18px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
  .banner h2{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px}
  .banner p{color:#bcd6c8;font-size:13px;margin-top:3px;max-width:560px}
  .banner .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;text-align:right;line-height:1}
  .banner .big small{display:block;font-family:"JetBrains Mono";font-size:11px;color:#9ec4b1;font-weight:400;margin-top:4px}
</style>
<style>
  .live-badge{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.1em;background:#1f6e47;color:#fff;
    padding:4px 9px;border-radius:4px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
  .live-badge .pulse{width:7px;height:7px;border-radius:50%;background:#7bf0a8;animation:pl 1.6s infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
  .mapfilter{cursor:pointer}
  .pin{cursor:pointer}
  .pindetail{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:13px;min-height:150px}
  #map circle.sel{stroke:#13201a;stroke-width:2}
</style>

<style>
  #kcbgate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,#13503a 0%,#0e3a2b 45%,#082319 100%);
    transition:opacity .4s ease;overflow:hidden}
  #kcbgate .kcb-mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;display:block;opacity:.9}
  #kcbgate .grain{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;pointer-events:none}
  .kcb-card{position:relative;z-index:2;width:min(440px,92vw);text-align:center;padding:10px 8px}
  .kcb-logo{width:270px;max-width:78%;height:auto;margin:0 auto 6px;display:block;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
  .kcb-rule{width:54px;height:3px;background:#2f9c6a;margin:18px auto 16px;border-radius:3px}
  .kcb-prod{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;color:#fff;letter-spacing:-.02em;line-height:1.05}
  .kcb-sub{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em;color:#bcd6c8;margin-top:9px}
  .kcb-form{display:flex;gap:8px;margin:24px auto 0;max-width:340px}
  .kcb-form input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:11px;
    padding:13px 15px;color:#fff;font-family:"Hanken Grotesk",sans-serif;font-size:15px;outline:none}
  .kcb-form input::placeholder{color:#8fb3a2}
  .kcb-form input:focus{border-color:#2f9c6a;background:rgba(255,255,255,.12)}
  .kcb-form button{background:#2f9c6a;color:#06281b;border:none;border-radius:11px;padding:13px 18px;font-weight:700;
    font-family:"Hanken Grotesk",sans-serif;font-size:15px;cursor:pointer;white-space:nowrap;transition:background .15s}
  .kcb-form button:hover{background:#36b87e}
  .kcb-err{color:#f3b0a0;font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px}
  .kcb-foot{margin-top:26px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:#6f9183;line-height:1.7}
</style>
